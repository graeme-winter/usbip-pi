# Which USB devices the Pi exports over USB/IP.
#
# One rule per line, first match wins, no match means "do not export".
#   VID:PID          allow by vendor/product id (lowercase hex, globs ok)
#   port:BUSID       allow by physical port bus id (globs ok)
#   !RULE            deny instead of allow
#   *                allow everything
#
# Find ids and bus ids with:  usbip list -l    (or lsusb -t)
# Hubs are never exported; devices behind them are handled one by one.
#
# Examples:
#   0403:6001        FTDI FT232 serial adapter
#   0403:*           anything from FTDI
#   port:1-1.3       whatever is plugged into that port
#   !0bda:*          never export Realtek devices
#
# Default: export everything that is not a hub.
*
