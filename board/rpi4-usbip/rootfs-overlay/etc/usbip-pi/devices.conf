# Where each USB device plugged into the Pi goes.
#
#   ACTION  MATCH        [PORTS  SETTINGS        MODE]   (serial only)
#
# ACTION   usbip   export the whole device over USB/IP (port 3240)
#          serial  keep it on the Pi; publish its serial port(s) via ser2net
#          ignore  leave it alone
# MATCH    VID:PID (lowercase hex), port:BUSID, or *; globs allowed
# PORTS    TCP port, or range FIRST-LAST for multi-port adapters. USB
#          interface N is published on FIRST + N (FT232/CH340/CP2102/
#          single ACM: one port; FT2232: 2; FT4232: 4; dual CDC-ACM uses
#          interfaces 0 and 2, so FIRST-FIRST+2). On the Pi each port is
#          linked as /dev/serial/by-tcp/<port>. ser2net listens on every
#          port in the range whether or not the device is plugged in.
# SETTINGS ser2net serialdev options, comma-separated, no spaces
#          (default 9600n81,local; e.g. 115200n81,local,rtscts)
# MODE     raw (default: plain TCP, e.g. EPICS drvAsynIPPort),
#          rfc2217 (client may change baud/DTR/RTS), or telnet
#
# First match wins; no match means ignore. Hubs are never exported.
# Find ids and bus ids with "usbip list -l" or "lsusb -t".
#
# Takes effect for devices plugged in afterwards. For serial rules also
# run "systemctl restart ser2net" (drops open serial connections).
#
# Examples:
#   serial  port:1-1.1   4001       115200n81,local
#   serial  0403:6011    4010-4013  9600n81,local    rfc2217
#   ignore  0bda:*
#   usbip   *
#
# Default: everything goes over USB/IP.
usbip   *
